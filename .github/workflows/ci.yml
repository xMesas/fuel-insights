name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers uses the Docker engine that the Ubuntu runner already has.
      # "sh" so the build does not depend on the executable bit, which Windows checkouts lose.
      - run: sh mvnw -B verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx ng test --watch=false

  images:
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build production images
        env:
          SECRETS_DIR: /tmp/fuel-insights-build-secrets
        run: docker compose -f compose.prod.yaml build
      - name: Smoke test production stack
        run: bash scripts/smoke-test.sh
