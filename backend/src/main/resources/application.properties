spring.application.name=fuel-insights

# Errors as RFC 9457 problem details (application/problem+json).
spring.mvc.problemdetails.enabled=true

# One day of history is about 12 MB and the Ministry server can be slow.
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=60s

# Lets the PostgreSQL driver send batched inserts as multi-row statements.
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

fuel-insights.ministry.base-url=https://sedeaplicaciones.minetur.gob.es/ServiciosRESTCarburantes/PreciosCarburantes
fuel-insights.ministry.retry-delay=2s

# Spring Batch: tables come from Flyway (V2) and jobs only run when the app asks.
spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false

# Daily catch-up at 06:00 Madrid time over the last 14 days; pause between days to be gentle with the Ministry.
fuel-insights.import.cron=0 0 6 * * *
fuel-insights.import.catch-up-days=14
fuel-insights.import.pause=2s
# Keeps the catch-up window complete: in development imports start from the API; production also catches up at
# startup. A day whose lock stays busy waits up to lock-wait; shutdown lets the day in progress finish within shutdown-wait.
fuel-insights.import.catch-up-on-startup=false
fuel-insights.import.lock-wait=5m
fuel-insights.import.shutdown-wait=60s
# Manual import endpoints (development only; false in production).
fuel-insights.import.api-enabled=true

# Current prices: the Ministry refreshes its list every half hour; a list already imported is not written again.
fuel-insights.current.cron=0 */15 * * * *
fuel-insights.current.refresh-on-startup=true

# Public charging sites (MITECO through the DGT National Access Point, DATEX II, refreshed daily). Checked every six
# hours; a feed already imported is not written again.
fuel-insights.charging.feed-url=https://nap.dgt.es/datex2/v3/miterd/EnergyInfrastructureTablePublication/electrolineras.xml
fuel-insights.charging.cron=0 20 */6 * * *
fuel-insights.charging.refresh-on-startup=true

# The public address of the site: absolute links of /sitemap.xml, /robots.txt and the emails (production: the domain).
fuel-insights.site.origin=http://localhost:4200

# Health: /livez and /readyz on the main port. Only readiness looks at the database: restarting the app does not
# fix a database that is down.
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.readiness.include=readinessState,db

# Accounts: sign in with an emailed link, no passwords. Development sends the emails to Mailpit (compose.yaml),
# whose inbox is at http://localhost:8025. The signing key is for development only: production reads its own secret.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# A mail server that is down must not mark the whole app as down: the site works without emails.
management.health.mail.enabled=false
fuel-insights.accounts.mail-from=fuel-insights <avisos@fuel-insights.local>
fuel-insights.accounts.signing-key=development-only-signing-key
fuel-insights.accounts.link-lifetime=15m
fuel-insights.accounts.links-per-window=3
fuel-insights.accounts.free-alerts=3
fuel-insights.accounts.max-favourites=50
# Sessions in PostgreSQL (tables from Flyway V7), kept for 30 days of inactivity.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30d
server.servlet.session.cookie.same-site=lax

# The ad-free plan with Stripe. Empty: the plan is off (its endpoints answer 503). Test mode keys come from the Stripe
# dashboard; production reads them from secrets.
fuel-insights.premium.stripe-secret-key=
fuel-insights.premium.webhook-secret=
fuel-insights.premium.price-id=

# Street addresses for the search box: CartoCiudad, the National Geographic Institute's geocoder (CC BY 4.0).
fuel-insights.geocoding.base-url=https://www.cartociudad.es/geocoder/api/geocoder
