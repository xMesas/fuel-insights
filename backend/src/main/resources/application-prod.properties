# Production: the public API only reads; the app imports by itself (catch-up at startup and every morning).
fuel-insights.import.api-enabled=false
fuel-insights.import.catch-up-on-startup=true

# Actuator on its own port, reachable only from inside the container (127.0.0.1).
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,info,metrics

# One JSON object per log line (Elastic Common Schema), ready for a log collector.
logging.structured.format.console=ecs

# Docker mounts the secrets as files in /run/secrets (spring.datasource.password). Not optional: without the
# secret the app must not start.
spring.config.import=configtree:/run/secrets/

# The session cookie only travels over HTTPS. The signing key must come from the secret above (no default here).
server.servlet.session.cookie.secure=true
fuel-insights.accounts.signing-key=
