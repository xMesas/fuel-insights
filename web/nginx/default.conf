map $uri $asset_cache_control {
	default "";
	"~^/(?:[^/]+/)*[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|ttf|otf)$" "public, max-age=31536000, immutable";
}

# The API reads the database on every map move (the board of a zone cannot be cached), so each client gets a fair
# share: 10 requests a second with bursts of 30, then 429. A page load and a quick pan stay well under it.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

# Rendering a page on the server costs more than an API answer: 5 a second with bursts of 20 per client.
limit_req_zone $binary_remote_addr zone=pages:10m rate=5r/s;

# Each sign-in link is an email: a few a minute per client is plenty (the app also caps them per address).
limit_req_zone $binary_remote_addr zone=links:10m rate=5r/m;

# Server-rendered pages change with the prices (every 15 minutes at most), so one rendering serves everyone for five
# minutes. proxy_cache_lock lets a single request render a page that is not cached while the others wait for it.
proxy_cache_path /tmp/page_cache levels=1:2 keys_zone=page_cache:10m max_size=256m inactive=30m use_temp_path=off;

server {
	listen 8080;
	server_tokens off;
	root /usr/share/nginx/html;

	gzip on;
	gzip_vary on;
	gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
	add_header Cache-Control $asset_cache_control always;

	resolver 127.0.0.11 valid=10s ipv6=off;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_connect_timeout 5s;
	proxy_send_timeout 30s;
	proxy_read_timeout 30s;

	location /api/ {
		limit_except GET { deny all; }
		limit_req zone=api burst=30 nodelay;
		limit_req_status 429;
		set $backend http://backend:8080;
		proxy_pass $backend;
	}

	# The account API is the only one that changes data: it may POST, PUT and DELETE (with a CSRF token, or Stripe's
	# signature on its webhook).
	location ~ ^/api/(me|auth|alerts|stripe)(/|$) {
		limit_req zone=api burst=30 nodelay;
		limit_req_status 429;
		set $backend http://backend:8080;
		proxy_pass $backend;
	}

	location = /api/auth/link {
		limit_except POST { deny all; }
		limit_req zone=links burst=3 nodelay;
		limit_req_status 429;
		set $backend http://backend:8080;
		proxy_pass $backend;
	}

	# The backend writes both with the site's public address.
	location = /sitemap.xml {
		set $backend http://backend:8080;
		proxy_pass $backend/api/sitemap.xml;
	}

	location = /robots.txt {
		set $backend http://backend:8080;
		proxy_pass $backend/api/robots.txt;
	}

	# Files of the build are served here; every other address is a page the Node server renders.
	location / {
		try_files $uri @pages;
	}

	location @pages {
		limit_except GET { deny all; }
		limit_req zone=pages burst=20 nodelay;
		limit_req_status 429;
		proxy_cache page_cache;
		proxy_cache_valid 200 404 5m;
		proxy_cache_lock on;
		proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
		set $ssr http://ssr:4000;
		proxy_pass $ssr;
	}

	location = /maplibre-gl-worker.mjs {
		default_type application/javascript;
	}
}
